// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // The androidx.browser:browser:1.4.0 force that used to live here is gone.
    //
    // It existed because @capgo/capacitor-social-login's Apple provider declares
    // androidx.browser 1.9.0 while its Google provider pulls
    // androidbrowserhelper:2.5.0, which pins {strictly 1.4.0} — and 1.9.0 needs
    // AGP 8.9.1 / compileSdk 36, which this project did not have. Its own comment
    // said to revisit once AGP was upgraded.
    //
    // Capacitor 8 took us to AGP 8.13.0 and compileSdk 36, so the constraint the
    // force worked around no longer applies and Gradle can resolve it normally.
    // If "Cannot find a version of androidx.browser:browser that satisfies the
    // version constraints" ever comes back, this is the history.
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
