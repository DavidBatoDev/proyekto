# Cloudflare Workers static-assets config — Proyekto web SPA.
#
# Pure static SPA, no Worker script: the built `dist/` is served directly by
# Cloudflare's asset layer. `not_found_handling` replaces the old
# web/vercel.json SPA rewrite
# ({"rewrites":[{"source":"/(.*)","destination":"/index.html"}]}) — any
# request that doesn't match a file in dist/ gets index.html (200), so
# TanStack Router's client-side routes resolve on hard refresh / deep link.
#
# There is deliberately no [[routes]] block, and its absence is NOT an
# oversight: www.proyekto.tech is bound as a Custom Domain in the Cloudflare
# dashboard (Workers -> proyekto-web -> Domains), because that is the only path
# that REPLACES the pre-existing DNS record in one step. Terraform's
# cloudflare_workers_custom_domain has no override flag and the "Add Domain"
# API refuses while a conflicting record exists, so binding from config would
# have meant deleting the record first and leaving www as NXDOMAIN in between.
#
# Verified by deliberate test on 2026-08-04: running `wrangler deploy` with no
# `routes` here does NOT strip the dashboard-bound domain. Adding a [[routes]]
# block later would additionally require widening the CI token to DNS:Edit +
# SSL:Edit, which it does not currently need.

name = "proyekto-web"
compatibility_date = "2026-08-04"
workers_dev = true
main = "worker.ts"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[vars]
BACKEND_API_URL = "https://api.proyekto.tech"
