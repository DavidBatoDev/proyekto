<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Proyekto Roadmap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --purple: #6d5dfc;
        --surface: #fff;
        --subtle: #f7f7fa;
        --border: #e2e3e9;
        --text: #1c1d22;
        --muted: #707583;
        --branch: #8a8f9d;
        --backlog: #7d8492;
        --progress: #3976e8;
        --completed: #168a59;
        --blocked: #d14343;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 0;
        background: transparent;
        color: var(--color-text-primary, var(--text));
      }

      body {
        padding: 8px;
      }

      .shell {
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--color-border-secondary, var(--border));
        border-radius: var(--border-radius-lg, 15px);
        background: var(--color-background-primary, var(--surface));
        box-shadow: var(--shadow-sm, 0 2px 8px rgb(17 24 39 / 0.07));
      }

      .heading {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--color-border-secondary, var(--border));
      }

      .mark {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        place-items: center;
        border-radius: 9px;
        background: var(--purple);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 5px 12px rgb(109 93 252 / 0.24);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 750;
      }

      .subheading {
        margin: 2px 0 0;
        color: var(--color-text-secondary, var(--muted));
        font-size: 12px;
      }

      .content {
        padding: 14px;
      }

      .loading,
      .error {
        margin: 0;
        padding: 24px 12px;
        color: var(--color-text-secondary, var(--muted));
        text-align: center;
        font-size: 13px;
      }

      .error {
        color: var(--color-text-danger, var(--blocked));
      }

      .ascii-roadmap {
        width: 100%;
        padding: 16px 18px 18px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--subtle);
      }

      .summary-row {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px;
      }

      .roadmap-title {
        margin: 0;
        font-size: 19px;
        font-weight: 780;
        letter-spacing: -0.02em;
      }

      .counts {
        margin: 5px 0 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 650;
        line-height: 1.5;
      }

      .description {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .divider {
        height: 1px;
        margin: 14px 0;
        background: var(--border);
      }

      .tree {
        display: grid;
        gap: 3px;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      .ascii-line {
        display: flex;
        align-items: baseline;
        min-width: 0;
      }

      .ascii-prefix {
        flex: 0 0 auto;
        color: var(--branch);
        white-space: pre;
        user-select: none;
      }

      .line-body {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .epic-name {
        font-weight: 760;
      }

      .feature-name,
      .milestone-name {
        font-weight: 520;
      }

      .empty-name {
        color: var(--muted);
        font-style: italic;
      }

      .status {
        margin-left: 7px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.025em;
        white-space: nowrap;
      }

      .status-backlog {
        color: var(--backlog);
      }

      .status-in-progress {
        color: var(--progress);
      }

      .status-completed {
        color: var(--completed);
      }

      .status-blocked {
        color: var(--blocked);
      }

      .milestone-heading {
        margin: 15px 0 5px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.07em;
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #202125;
          --subtle: #191a1e;
          --border: #393b43;
          --text: #f2f2f4;
          --muted: #a2a6b0;
          --branch: #777c89;
          --backlog: #a4a9b4;
          --progress: #72a0ff;
          --completed: #4bd099;
          --blocked: #ff7777;
        }
      }

      @media (max-width: 560px) {
        .content {
          padding: 10px;
        }

        .ascii-roadmap {
          padding: 14px 12px 16px;
        }

        .tree {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" data-proyekto-roadmap-app>
      <header class="heading">
        <div class="mark" aria-hidden="true">P</div>
        <div>
          <h1>Proyekto Roadmap</h1>
          <p class="subheading">Live roadmap summary</p>
        </div>
      </header>
      <section class="content" aria-live="polite">
        <p id="loading" class="loading">Loading roadmap…</p>
        <p id="error" class="error" hidden></p>
        <div id="visual" hidden></div>
      </section>
    </main>
    <script type="module" src="./roadmap-summary.ts"></script>
  </body>
</html>
