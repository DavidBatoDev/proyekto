<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Proyekto Roadmap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 0;
        background: transparent;
        color: var(--color-text-primary, #171717);
      }

      body {
        padding: 8px;
      }

      .shell {
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--color-border-secondary, #e5e7eb);
        border-radius: var(--border-radius-lg, 14px);
        background: var(--color-background-primary, #ffffff);
        box-shadow: var(--shadow-sm, 0 1px 3px rgb(0 0 0 / 0.08));
      }

      .heading {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--color-border-secondary, #e5e7eb);
      }

      .mark {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 28px;
        place-items: center;
        border-radius: 8px;
        background: #6d5dfc;
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.3;
      }

      .subheading {
        margin: 2px 0 0;
        color: var(--color-text-secondary, #6b7280);
        font-size: 12px;
      }

      .content {
        padding: 12px;
      }

      .loading,
      .error {
        margin: 0;
        padding: 24px 12px;
        color: var(--color-text-secondary, #6b7280);
        text-align: center;
        font-size: 13px;
      }

      .error {
        color: var(--color-text-danger, #b42318);
      }

      #visual {
        width: 100%;
        overflow-x: auto;
      }

      #visual svg,
      #visual img {
        display: block;
        width: 100%;
        height: auto;
        min-width: 640px;
      }

      .fallback-title {
        margin: 0 0 4px;
        font-size: 18px;
      }

      .counts {
        margin: 0 0 14px;
        color: var(--color-text-secondary, #6b7280);
        font-size: 13px;
      }

      .tree,
      .tree ul {
        margin: 0;
        padding-left: 22px;
      }

      .tree > li {
        margin-bottom: 10px;
      }

      .tree li {
        padding: 2px 0;
      }

      .status {
        margin-left: 6px;
        color: var(--color-text-secondary, #6b7280);
        font-size: 12px;
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          color: var(--color-text-primary, #f5f5f5);
        }

        .shell {
          border-color: var(--color-border-secondary, #383838);
          background: var(--color-background-primary, #1f1f1f);
        }

        .heading {
          border-color: var(--color-border-secondary, #383838);
        }

        .subheading,
        .loading,
        .counts,
        .status {
          color: var(--color-text-secondary, #a3a3a3);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" data-proyekto-roadmap-app>
      <header class="heading">
        <div class="mark" aria-hidden="true">P</div>
        <div>
          <h1>Proyekto Roadmap</h1>
          <p class="subheading">Live roadmap summary</p>
        </div>
      </header>
      <section class="content" aria-live="polite">
        <p id="loading" class="loading">Loading roadmap…</p>
        <p id="error" class="error" hidden></p>
        <div id="visual" hidden></div>
        <div id="fallback" hidden></div>
      </section>
    </main>
    <script type="module" src="./roadmap-summary.ts"></script>
  </body>
</html>
