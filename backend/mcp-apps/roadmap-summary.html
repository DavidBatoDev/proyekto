<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Proyekto Roadmap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        --app-purple: #6d5dfc;
        --app-purple-soft: #eeebff;
        --canvas: #f7f8fb;
        --surface: #ffffff;
        --surface-raised: #ffffff;
        --border: #e2e5ec;
        --border-strong: #ccd1dc;
        --text: #181a20;
        --text-muted: #687080;
        --line: #cfd4df;
        --backlog: #8a93a3;
        --in-progress: #4f7cff;
        --completed: #22a06b;
        --blocked: #e05252;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 0;
        background: transparent;
        color: var(--color-text-primary, var(--text));
      }

      body {
        padding: 8px;
      }

      .shell {
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--color-border-secondary, var(--border));
        border-radius: var(--border-radius-lg, 16px);
        background: var(--color-background-primary, var(--surface));
        box-shadow: var(--shadow-sm, 0 2px 8px rgb(17 24 39 / 0.07));
      }

      .heading {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--color-border-secondary, var(--border));
      }

      .mark {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        place-items: center;
        border-radius: 9px;
        background: var(--app-purple);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 5px 12px rgb(109 93 252 / 0.24);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 750;
        line-height: 1.3;
      }

      .subheading {
        margin: 2px 0 0;
        color: var(--color-text-secondary, var(--text-muted));
        font-size: 12px;
      }

      .content {
        padding: 12px;
      }

      .loading,
      .error {
        margin: 0;
        padding: 28px 12px;
        color: var(--color-text-secondary, var(--text-muted));
        text-align: center;
        font-size: 13px;
      }

      .error {
        color: var(--color-text-danger, var(--blocked));
      }

      #visual {
        width: 100%;
        overflow-x: auto;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }

      #visual > svg,
      #visual > img {
        display: block;
        width: 100%;
        height: auto;
        min-width: 720px;
      }

      .roadmap-board {
        min-width: 760px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 13px;
        background:
          radial-gradient(
              circle at 1px 1px,
              rgb(145 153 169 / 0.2) 1px,
              transparent 0
            )
            0 0 / 18px 18px,
          var(--canvas);
      }

      .board-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 20px 15px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 94%, transparent);
      }

      .board-title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .board-title {
        margin: 0;
        font-size: 20px;
        font-weight: 780;
        letter-spacing: -0.02em;
      }

      .board-description {
        max-width: 610px;
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        width: max-content;
        padding: 3px 8px;
        border: 1px solid
          color-mix(in srgb, var(--status-color) 28%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--status-color) 11%, transparent);
        color: var(--status-color);
        font-size: 10px;
        font-weight: 700;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: 0.035em;
        white-space: nowrap;
      }

      .status-pill::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        content: '';
      }

      .status-backlog {
        --status-color: var(--backlog);
      }

      .status-in-progress {
        --status-color: var(--in-progress);
      }

      .status-completed {
        --status-color: var(--completed);
      }

      .status-blocked {
        --status-color: var(--blocked);
      }

      .metrics {
        display: flex;
        flex: 0 0 auto;
        gap: 7px;
      }

      .metric {
        min-width: 68px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-raised);
        text-align: center;
        box-shadow: 0 1px 2px rgb(17 24 39 / 0.04);
      }

      .metric-value {
        display: block;
        font-size: 17px;
        font-weight: 780;
        line-height: 1;
      }

      .metric-label {
        display: block;
        margin-top: 4px;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.055em;
      }

      .milestones {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: color-mix(
          in srgb,
          var(--app-purple-soft) 38%,
          var(--surface)
        );
      }

      .milestones-label {
        flex: 0 0 auto;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .milestone {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        padding: 5px 9px;
        border: 1px solid
          color-mix(in srgb, var(--app-purple) 25%, var(--border));
        border-radius: 8px;
        background: var(--surface-raised);
        font-size: 11px;
        font-weight: 650;
      }

      .milestone::before {
        width: 7px;
        height: 7px;
        transform: rotate(45deg);
        border-radius: 1px;
        background: var(--app-purple);
        content: '';
      }

      .milestone-date {
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 500;
      }

      .lanes {
        display: grid;
        gap: 14px;
        padding: 18px 20px 20px;
      }

      .epic-lane {
        display: grid;
        grid-template-columns: 190px 42px minmax(460px, 1fr);
        min-height: 116px;
      }

      .epic-card {
        position: relative;
        z-index: 2;
        align-self: start;
        min-height: 100px;
        padding: 13px;
        border: 1px solid
          color-mix(in srgb, var(--app-purple) 24%, var(--border));
        border-left: 4px solid var(--app-purple);
        border-radius: 11px;
        background: var(--surface-raised);
        box-shadow: 0 4px 12px rgb(38 42 54 / 0.07);
      }

      .node-kind {
        display: block;
        margin-bottom: 7px;
        color: var(--app-purple);
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.075em;
      }

      .epic-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 760;
        line-height: 1.35;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .connector {
        position: relative;
        min-height: 100px;
      }

      .connector::before {
        position: absolute;
        top: 49px;
        right: 0;
        left: 0;
        height: 2px;
        background: var(--line);
        content: '';
      }

      .connector::after {
        position: absolute;
        top: 44px;
        right: -1px;
        width: 10px;
        height: 10px;
        border: 2px solid var(--canvas);
        border-radius: 50%;
        background: var(--app-purple);
        content: '';
      }

      .feature-track {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
        padding: 0 0 7px 10px;
        overflow-x: auto;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }

      .feature-track::before {
        position: absolute;
        top: 49px;
        right: 0;
        left: 0;
        height: 2px;
        background: var(--line);
        content: '';
      }

      .feature-card {
        --status-color: var(--backlog);
        position: relative;
        z-index: 1;
        width: 180px;
        min-width: 180px;
        min-height: 100px;
        padding: 12px;
        border: 1px solid var(--border);
        border-top: 3px solid var(--status-color);
        border-radius: 10px;
        background: var(--surface-raised);
        box-shadow: 0 3px 9px rgb(38 42 54 / 0.06);
      }

      .feature-card::before {
        position: absolute;
        top: 41px;
        left: -7px;
        width: 7px;
        height: 2px;
        background: var(--line);
        content: '';
      }

      .feature-index {
        display: block;
        margin-bottom: 7px;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.055em;
      }

      .feature-title {
        display: -webkit-box;
        overflow: hidden;
        min-height: 34px;
        margin: 0 0 9px;
        font-size: 12px;
        font-weight: 680;
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .empty-track {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        min-height: 100px;
        width: 100%;
        padding: 14px 18px;
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        background: color-mix(in srgb, var(--surface-raised) 82%, transparent);
        color: var(--text-muted);
        font-size: 11px;
      }

      .empty-track::before {
        margin-right: 8px;
        color: var(--app-purple);
        font-size: 18px;
        content: '+';
      }

      .no-epics {
        display: grid;
        min-height: 130px;
        place-items: center;
        border: 1px dashed var(--border-strong);
        border-radius: 11px;
        background: color-mix(in srgb, var(--surface-raised) 82%, transparent);
        color: var(--text-muted);
        font-size: 12px;
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --app-purple-soft: #2e2854;
          --canvas: #17181c;
          --surface: #202125;
          --surface-raised: #26272c;
          --border: #373941;
          --border-strong: #4a4d57;
          --text: #f4f4f5;
          --text-muted: #a1a5ae;
          --line: #484b55;
          --backlog: #a2a9b7;
          --in-progress: #79a0ff;
          --completed: #49c58b;
          --blocked: #f07878;
        }

        html,
        body {
          color: var(--color-text-primary, var(--text));
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" data-proyekto-roadmap-app>
      <header class="heading">
        <div class="mark" aria-hidden="true">P</div>
        <div>
          <h1>Proyekto Roadmap</h1>
          <p class="subheading">Live roadmap summary</p>
        </div>
      </header>
      <section class="content" aria-live="polite">
        <p id="loading" class="loading">Loading roadmap…</p>
        <p id="error" class="error" hidden></p>
        <div id="visual" hidden></div>
      </section>
    </main>
    <script type="module" src="./roadmap-summary.ts"></script>
  </body>
</html>
