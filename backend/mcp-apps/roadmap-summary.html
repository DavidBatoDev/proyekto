<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Proyekto Roadmap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        --purple: #6d5dfc;
        --surface: #ffffff;
        --surface-soft: #f8f8fb;
        --surface-node: #f4f4f8;
        --border: #e2e3e9;
        --line: #c8cbd5;
        --text: #1b1c21;
        --muted: #707583;
        --backlog: #727988;
        --backlog-bg: #eef0f4;
        --progress: #2f6fe4;
        --progress-bg: #eaf1ff;
        --completed: #14845a;
        --completed-bg: #e5f7ef;
        --blocked: #cf3f48;
        --blocked-bg: #fdecef;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 0;
        background: transparent;
        color: var(--color-text-primary, var(--text));
      }

      body {
        padding: 8px;
      }

      .shell {
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--color-border-secondary, var(--border));
        border-radius: var(--border-radius-lg, 16px);
        background: var(--color-background-primary, var(--surface));
        box-shadow: var(--shadow-sm, 0 3px 12px rgb(17 24 39 / 0.08));
      }

      .heading {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 17px 20px;
        border-bottom: 1px solid var(--color-border-secondary, var(--border));
      }

      .mark {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        place-items: center;
        border-radius: 11px;
        background: linear-gradient(145deg, #7768ff, #5c4bf2);
        color: #fff;
        font-size: 18px;
        font-weight: 850;
        box-shadow: 0 7px 16px rgb(109 93 252 / 0.28);
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 760;
        letter-spacing: -0.01em;
      }

      .subheading {
        margin: 2px 0 0;
        color: var(--color-text-secondary, var(--muted));
        font-size: 13px;
      }

      .content {
        padding: 22px 24px 26px;
      }

      .loading,
      .error {
        margin: 0;
        padding: 30px 12px;
        color: var(--color-text-secondary, var(--muted));
        text-align: center;
        font-size: 14px;
      }

      .error {
        color: var(--color-text-danger, var(--blocked));
      }

      .roadmap-hierarchy {
        width: 100%;
        min-width: 0;
      }

      .summary-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .roadmap-title {
        margin: 0;
        font-size: 24px;
        font-weight: 790;
        letter-spacing: -0.035em;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 11px;
      }

      .stat {
        padding: 5px 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
      }

      .stat strong {
        color: var(--text);
        font-size: 13px;
      }

      .description {
        max-width: 760px;
        margin: 11px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .hierarchy-tree {
        display: grid;
        gap: 22px;
        margin-top: 25px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
      }

      .epic-branch {
        min-width: 0;
      }

      .tree-node {
        position: relative;
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 11px;
        min-width: 0;
      }

      .node-marker {
        position: relative;
        z-index: 2;
        display: block;
        width: 11px;
        height: 11px;
        margin: 16px auto 0;
        border: 2px solid var(--surface);
        border-radius: 50%;
        background: var(--line);
        box-shadow: 0 0 0 2px var(--line);
      }

      .node-content {
        min-width: 0;
      }

      .node-label {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 760;
        letter-spacing: 0.07em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .node-title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .node-title {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 15px;
        font-weight: 580;
        line-height: 1.4;
      }

      .epic-node .node-marker {
        width: 15px;
        height: 15px;
        margin-top: 13px;
        background: var(--purple);
        box-shadow:
          0 0 0 2px var(--surface),
          0 0 0 4px rgb(109 93 252 / 0.22);
      }

      .epic-node .node-title {
        font-size: 17px;
        font-weight: 730;
        letter-spacing: -0.012em;
      }

      .tree-children {
        position: relative;
        display: grid;
        gap: 9px;
        margin: 9px 0 0 12px;
        padding-left: 35px;
      }

      .tree-children::before {
        position: absolute;
        top: -23px;
        bottom: 22px;
        left: 0;
        width: 1px;
        background: var(--line);
        content: '';
      }

      .tree-children > .tree-node::before {
        position: absolute;
        top: 21px;
        left: -35px;
        width: 35px;
        height: 1px;
        background: var(--line);
        content: '';
      }

      .feature-node .node-content,
      .empty-node .node-content,
      .milestone-node .node-content {
        padding: 9px 12px;
        border-radius: 9px;
        background: var(--surface-node);
      }

      .feature-node .node-marker {
        background: var(--purple);
        box-shadow: 0 0 0 2px var(--surface);
      }

      .empty-node .node-marker {
        border-style: dashed;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--line);
      }

      .empty-node .node-title {
        color: var(--muted);
        font-style: italic;
        font-weight: 480;
      }

      .status-badge {
        --status-color: var(--backlog);
        --status-background: var(--backlog-bg);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        padding: 4px 8px;
        border: 1px solid
          color-mix(in srgb, var(--status-color) 24%, transparent);
        border-radius: 999px;
        background: var(--status-background);
        color: var(--status-color);
        font-size: 10px;
        font-weight: 780;
        letter-spacing: 0.035em;
        line-height: 1.1;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .status-badge::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        content: '';
      }

      .status-in-progress {
        --status-color: var(--progress);
        --status-background: var(--progress-bg);
      }

      .status-completed {
        --status-color: var(--completed);
        --status-background: var(--completed-bg);
      }

      .status-blocked {
        --status-color: var(--blocked);
        --status-background: var(--blocked-bg);
      }

      .milestone-section {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      .section-title {
        margin: 0 0 13px;
        font-size: 14px;
        font-weight: 720;
      }

      .milestone-tree {
        display: grid;
        gap: 9px;
      }

      .milestone-node .node-marker {
        width: 10px;
        height: 10px;
        transform: rotate(45deg);
        border-radius: 2px;
        background: var(--purple);
        box-shadow: none;
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #202125;
          --surface-soft: #191a1e;
          --surface-node: #292a30;
          --border: #3a3c44;
          --line: #555966;
          --text: #f2f2f4;
          --muted: #a7aab3;
          --backlog: #b1b6c2;
          --backlog-bg: #34363d;
          --progress: #7da7ff;
          --progress-bg: #253554;
          --completed: #58d49d;
          --completed-bg: #203e34;
          --blocked: #ff858b;
          --blocked-bg: #4a282d;
        }
      }

      @media (max-width: 560px) {
        .heading {
          padding: 15px 16px;
        }

        .content {
          padding: 18px 16px 22px;
        }

        .roadmap-title {
          font-size: 21px;
        }

        .tree-children {
          margin-left: 9px;
          padding-left: 27px;
        }

        .tree-children > .tree-node::before {
          left: -27px;
          width: 27px;
        }

        .tree-node {
          grid-template-columns: 20px minmax(0, 1fr);
          gap: 8px;
        }

        .epic-node .node-title {
          font-size: 16px;
        }

        .node-title {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" data-proyekto-roadmap-app>
      <header class="heading">
        <div class="mark" aria-hidden="true">P</div>
        <div>
          <h1>Proyekto Roadmap</h1>
          <p class="subheading">Live roadmap summary</p>
        </div>
      </header>
      <section class="content" aria-live="polite">
        <p id="loading" class="loading">Loading roadmap...</p>
        <p id="error" class="error" hidden></p>
        <div id="visual" hidden></div>
      </section>
    </main>
    <script type="module" src="./roadmap-summary.ts"></script>
  </body>
</html>
